name: Build

# Every push/PR: build against reference assemblies, check docs and version,
# package the ZIP as an artifact.
# A tag vX.Y.Z additionally checks the tag against PluginVersion and publishes
# a GitHub Release with the ZIP, its SHA-256 and the CHANGELOG section.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      # Game assemblies come from lib/ (tools/Update-GameRefs.ps1).
      # These packages provide the rest, reference-only as well.
      UNITY_MODULES: '6000.5.11'
      BEPINEX_BASELIB: '5.4.21'
      HARMONYX: '2.16.1'

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet references
        id: cache-refs
        uses: actions/cache@v4
        with:
          path: nuget-refs
          key: refs-${{ env.UNITY_MODULES }}-${{ env.BEPINEX_BASELIB }}-${{ env.HARMONYX }}

      - name: Download NuGet references
        if: steps.cache-refs.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force nuget-refs, tmp | Out-Null
          $packages = @{
            unity   = "https://nuget.bepinex.dev/v3/package/unityengine.modules/$env:UNITY_MODULES/unityengine.modules.$env:UNITY_MODULES.nupkg"
            bepinex = "https://nuget.bepinex.dev/v3/package/bepinex.baselib/$env:BEPINEX_BASELIB/bepinex.baselib.$env:BEPINEX_BASELIB.nupkg"
            harmony = "https://api.nuget.org/v3-flatcontainer/harmonyx/$env:HARMONYX/harmonyx.$env:HARMONYX.nupkg"
          }
          foreach ($name in $packages.Keys) {
            Invoke-WebRequest -Uri $packages[$name] -OutFile "tmp/$name.zip" -MaximumRetryCount 3 -RetryIntervalSec 5
            Expand-Archive "tmp/$name.zip" -DestinationPath "tmp/$name" -Force
          }
          Get-ChildItem tmp/unity -Recurse -Filter 'UnityEngine*.dll' | Where-Object FullName -like '*net35*' | Copy-Item -Destination nuget-refs
          Get-ChildItem tmp/bepinex -Recurse -Filter 'BepInEx.dll' | Where-Object FullName -like '*net35*' | Copy-Item -Destination nuget-refs
          Get-ChildItem tmp/harmony -Recurse -Filter '0Harmony.dll' | Where-Object FullName -like '*net35*' | Copy-Item -Destination nuget-refs

      - name: Assemble references
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force refs | Out-Null
          Copy-Item nuget-refs/*.dll refs/
          Copy-Item lib/*.dll refs/
          $required = 'BepInEx.dll', '0Harmony.dll',
            'assembly_valheim.dll', 'assembly_guiutils.dll', 'assembly_utils.dll',
            'UnityEngine.dll', 'UnityEngine.CoreModule.dll', 'UnityEngine.UI.dll',
            'UnityEngine.IMGUIModule.dll', 'UnityEngine.InputLegacyModule.dll',
            'UnityEngine.TextRenderingModule.dll', 'UnityEngine.UIModule.dll',
            'Unity.TextMeshPro.dll'
          $missing = $required | Where-Object { -not (Test-Path "refs/$_") }
          if ($missing) { throw "Missing references: $($missing -join ', ')" }
          Write-Host "References built from Valheim $(Get-Content lib/GAME_VERSION.txt)."

      - name: Check tag matches PluginVersion
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $plugin = Get-Content Plugin.cs -Raw
          $version = [regex]::Match($plugin, 'PluginVersion\s*=\s*"([^"]+)"').Groups[1].Value
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match PluginVersion $version."
          }

      - name: Build, check and package
        id: package
        run: ./tools/Package-Release.ps1 -ReferencePath "${{ github.workspace }}/refs"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HeroRadialMenus
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $heading = $lines | Select-String -Pattern "^## $([regex]::Escape($version))\b" | Select-Object -First 1
          if (-not $heading) { throw "CHANGELOG.md has no section for $version." }
          if ($heading.Line -match 'unpublished') {
            throw "CHANGELOG.md still marks $version as unpublished; replace it with the release date."
          }
          $start = $heading.LineNumber
          $body = @()
          foreach ($line in $lines[$start..($lines.Count - 1)]) {
            if ($line -match '^## ') { break }
            $body += $line
          }
          ($body -join "`n").Trim() | Set-Content release-notes.md -Encoding utf8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
